<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}JobConnect{% endblock %}</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><nav><a class="brand" href="/">JobConnect<span>Pro</span></a><form action="/jobs" class="navsearch"><input name="q" placeholder="Search jobs, skills, companies"></form><div class="navlinks"><a href="/jobs">Jobs</a>{% if session.uid %}<a href="/dashboard">Dashboard</a><a href="/profile">Profile</a><a class="btn ghost" href="/logout">Logout</a>{% else %}<a href="/login">Sign in</a><a class="btn" href="/register">Join now</a>{% endif %}</div></nav>{% with m=get_flashed_messages() %}{% if m %}<div class="flash">{{m[-1]}}</div>{% endif %}{% endwith %}<main>{% block content %}{% endblock %}</main><footer>JobConnect Pro · Final Year Recruitment Portal · Demo data is fictional</footer></body></html>
