{% extends 'base.html' %}{% block content %}<div class="formpage"><h1>Professional profile</h1><p>This information is shown to recruiters when you apply.</p><form method="post" enctype="multipart/form-data" class="formgrid"><label>Full name<input name="name" value="{{user.name}}" required></label><label>Phone<input name="phone" value="{{user.phone or ''}}"></label><label>Location<input name="location" value="{{user.location or ''}}"></label><label>Headline<input name="headline" value="{{user.headline or ''}}" placeholder="Python Developer"></label><label class="full">About<textarea name="bio" rows="4">{{user.bio or ''}}</textarea></label><label class="full">Skills<input name="skills" value="{{user.skills or ''}}"></label><label>Experience<input name="experience" value="{{user.experience or ''}}"></label><label>Education<input name="education" value="{{user.education or ''}}"></label><label>Company<input name="company" value="{{user.company or ''}}"></label><label>Resume (PDF/DOC)<input type="file" name="resume"></label><button class="full">Save profile</button></form></div>{% endblock %}
