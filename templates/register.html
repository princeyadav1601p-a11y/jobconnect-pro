{% extends 'base.html' %}{% block content %}<div class="auth"><h1>Create your account</h1><form method="post"><label>Full name<input name="name" required></label><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required></label><label>I am a<select name="role"><option value="jobseeker">Job seeker</option><option value="recruiter">Recruiter / Employer</option></select></label><label>Phone<input name="phone"></label><label>Location<input name="location"></label><label>Skills<input name="skills" placeholder="Python, SQL, Communication"></label><label>Company (for recruiters)<input name="company"></label><button>Create account</button></form></div>{% endblock %}
