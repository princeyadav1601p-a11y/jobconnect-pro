{% extends 'base.html' %}{% block content %}<div class="formpage"><h1>Post a new job</h1><p>Create a detailed listing to attract relevant candidates.</p><form method="post" class="formgrid"><label>Job title<input name="title" required></label><label>Company<input name="company" required></label><label>Location<input name="location" required></label><label>Job type<select name="job_type"><option>Full-time</option><option>Internship</option><option>Part-time</option></select></label><label>Work mode<select name="work_mode"><option>On-site</option><option>Hybrid</option><option>Remote</option></select></label><label>Experience<input name="experience" placeholder="0-2 years" required></label><label>Minimum annual salary ₹<input type="number" name="min_salary" required></label><label>Maximum annual salary ₹<input type="number" name="max_salary" required></label><label>Vacancies<input type="number" name="vacancies" value="1" required></label><label class="full">Skills<input name="skills" placeholder="Python, Flask, SQL" required></label><label class="full">Job description<textarea name="description" rows="5" required></textarea></label><label class="full">Requirements<textarea name="requirements" rows="4" required></textarea></label><button class="full">Publish job</button></form></div>{% endblock %}
